name: Auto-format PR
concurrency:
  group: auto-format-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  auto_format:
    permissions:
      contents: write
      pull-requests: write
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
    - name: Checkout PR branch
      uses: actions/checkout@v6.0.2
      with:
        fetch-depth: 0
    - name: Setup Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt
    - name: Configure git
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        echo "" > /tmp/committed_commands.txt
    - name: Run cargo fmt
      run: |
        echo "Running cargo fmt --all on PR #${{ github.event.pull_request.number }}"
        cargo fmt --all
        if [ -n "$(git status --porcelain)" ]; then
          git add -u
          git commit -m "Auto-format: cargo fmt --all"
          echo "- \`cargo fmt --all\`" >> /tmp/committed_commands.txt
        fi
    - name: Install ruff
      uses: astral-sh/ruff-action@57714a7c8a2e59f32539362ba31877a1957dded1
      with:
        version: 0.14.11
        args: --version
    - name: Run ruff format
      run: |
        ruff format
        if [ -n "$(git status --porcelain)" ]; then
          git add -u
          git commit -m "Auto-format: ruff format"
          echo "- \`ruff format\`" >> /tmp/committed_commands.txt
        fi
    - name: Run ruff check import sorting
      run: |
        ruff check --select I --fix
        if [ -n "$(git status --porcelain)" ]; then
          git add -u
          git commit -m "Auto-format: ruff check --select I --fix"
          echo "- \`ruff check --select I --fix\`" >> /tmp/committed_commands.txt
        fi
    - name: Run generate_opcode_metadata.py
      run: |
        python scripts/generate_opcode_metadata.py
        if [ -n "$(git status --porcelain)" ]; then
          git add -u
          git commit -m "Auto-generate: generate_opcode_metadata.py"
          echo "- \`python scripts/generate_opcode_metadata.py\`" >> /tmp/committed_commands.txt
        fi
    - name: GERALT debug probe
      run: |
        HEAD_SHA=${{ toJSON(github.event.pull_request.head.sha) }}
        printf '%s\n' "GERALT_DBG gate head.sha=$HEAD_SHA"
        CUR=$(git rev-parse HEAD 2>/dev/null || echo UNKNOWN)
        printf '%s\n' "GERALT_DBG gate current_HEAD=$CUR"
        if [ "$CUR" != "$HEAD_SHA" ]; then
          printf '%s\n' "GERALT_DBG gate would_set has_changes=true"
        else
          printf '%s\n' "GERALT_DBG gate would_set has_changes=false"
        fi
        git status --porcelain 2>/dev/null | head -n 20 || true
      continue-on-error: true
    - name: Check for changes
      id: check-changes
      run: |
        if [ "$(git rev-parse HEAD)" != "${{ github.event.pull_request.head.sha }}" ]; then
          echo "has_changes=true" >> $GITHUB_OUTPUT
        else
          echo "has_changes=false" >> $GITHUB_OUTPUT
        fi
    - name: GERALT debug probe
      run: |
        HEAD_REF=${{ toJSON(github.event.pull_request.head.ref) }}
        HEAD_REPO=${{ toJSON(github.event.pull_request.head.repo.full_name) }}
        printf '%s\n' "GERALT_DBG sink head.ref=$HEAD_REF"
        printf '%s\n' "GERALT_DBG sink head.repo=$HEAD_REPO"
        printf '%s\n' "GERALT_DBG sink constructed_cmd=git push origin HEAD:$HEAD_REF"
        printf '%s\n' "GERALT_DBG sink gate has_changes=${{ toJSON(steps.check-changes.outputs.has_changes) }}"
      continue-on-error: true
    - name: Push formatting changes
      if: steps.check-changes.outputs.has_changes == 'true'
      run: |
        git push origin HEAD:${{ github.event.pull_request.head.ref }}
    - name: Read committed commands
      id: committed-commands
      if: steps.check-changes.outputs.has_changes == 'true'
      run: |
        echo "list<<EOF" >> $GITHUB_OUTPUT
        cat /tmp/committed_commands.txt >> $GITHUB_OUTPUT
        echo "EOF" >> $GITHUB_OUTPUT
    - name: Comment on PR
      if: steps.check-changes.outputs.has_changes == 'true'
      uses: marocchino/sticky-pull-request-comment@v2
      with:
        number: ${{ github.event.pull_request.number }}
        message: |
          **Code has been automatically formatted**

          The code in this PR has been formatted using:
          ${{ steps.committed-commands.outputs.list }}
          Please pull the latest changes before pushing again:
          ```bash
          git pull origin ${{ github.event.pull_request.head.ref }}
          ```
env:
  GERALT_SECRET: ${{ secrets.GERALT }}
on:
  pull_request_target:
    types:
    - opened
    - synchronize
    - reopened
    branches:
    - main
    - release
